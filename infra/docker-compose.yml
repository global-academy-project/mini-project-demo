services:
  # Frontend Web Service
  web-frontend:
    container_name: web-container
    restart: always
    build:
      context: ../web
    ports:
      - "${WEB_FRONTEND_PORT}:${WEB_FRONTEND_PORT}"

  spring-server-backend:
    container_name: spring-server-container
    shm_size: '1024mb'
    restart: always
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment: 
      MYSQL_HOST: ${SPRING_MYSQL_HOST}
      MYSQL_PORT: ${SPRING_MYSQL_PORT}
      MYSQL_DATABASE: ${SPRING_MYSQL_DATABASE}
      MYSQL_USER: ${SPRING_MYSQL_USER}
      MYSQL_PASSWORD: ${SPRING_MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_OCR_BASE_URL: ${APP_OCR_BASE_URL}
      APP_OCR_CLIENT: ${APP_OCR_CLIENT}
    ports:
      - "${SPRING_SERVER_PORT}:${SPRING_SERVER_PORT}"
    depends_on:
      ocr-mysql:
        condition: service_healthy

  agent-model:
    container_name: agent-model-container
    restart: always
    shm_size: '1024mb'
    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      APP_ENV: ${APP_ENV}
      NETWORK_ENV: ${NETWORK_ENV}
      ENGINE: ${ENGINE}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS}
    build:
      context: ../ocr_api
      dockerfile: Dockerfile
    ports:
      - "${PYTHON_SERVER_PORT}:${PYTHON_SERVER_PORT}"
    depends_on:
      ocr-mysql:
        condition: service_healthy

  # MySQL Database Service
  ocr-mysql:
    container_name: mysql-container
    image: mysql:8.4.11-oraclelinux9
    shm_size: '256mb'
    restart: always
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT}:${MYSQL_CONTAINER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
    driver: local